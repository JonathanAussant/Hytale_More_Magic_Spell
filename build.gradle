plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.azuredoom.hytale-tools' version '1.+'
    id 'com.azuredoom.hytalepublisher' version '1.+'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of((project.java_version as String).toInteger())
    }
    withSourcesJar()
    withJavadocJar()
}


dependencies {
    implementation 'curse.maven:hexcode-1448311:9146849'
    // compileOnly 'curse.maven:hexcode-1448311:8748618'
    // implementation files('lib/Hexcode-0.11.0.jar')
}


hytalePublisher {
    version       = project.version
    releaseType   = "beta"
    changelogFile = "changelog.md"
    gameVersion   = project.hytale_version.toString()

    modtale {
        enabled   = false
        projectId = project.modtale_uuid
        patchline = project.patchline.toString()
    }

    curseforge {
        enabled   = true
        projectId = project.curseforgeID

        optional "hexcode"
        optional "patchly"
    }

    modifold {
        enabled   = false
        projectId = project.modifold_id

        optional "patchly"
        optional "hexcode"
    }
}


hytaleTools {
    manifestGroup = 'org.MoreMagicSpell'
    modCredits = 'Im404,Rirpod'
    patchline = 'release'
    modId = 'More_Magic_Spell'
    mainClass = 'org.MoreMagicSpell.MoreMagicSpell'
    manifestOptionalDependencies='Riprod:Hexcode=^0.10.0,Riprod:Patchly=*'

    injectServerJavadocsIntoSources = true
}  